schema_version = 2

[orchestrator]
poll_seconds = 3
global_parallel_objectives = 2
planning_timeout_seconds = 900
planning_retry_backoff_seconds = 30
worker_timeout_seconds = 1200
review_timeout_seconds = 1200
review_transport_attempts = 3
review_retry_backoff_seconds = 15
command_timeout_seconds = 300
heartbeat_seconds = 5

[worker_pool]
max_concurrency = 1

[recovery]
# Additional corrective attempts authorized by Judge NEEDS_FIX (0..3).
max_retries = 0

[model_router]
# Ordered deterministic routing policy. With no rule tables, NativeRuntime uses
# the role's configured model and HermesRuntime remains profile-managed.
version = 1
