name: orchestra

x-application: &application
  image: ${ORCHESTRA_CONTROL_PLANE_IMAGE:-orchestra-control-plane:local}
  build:
    context: ..
    dockerfile: images/orchestra-control-plane.Dockerfile
  user: "${ORCHESTRA_UID:?ORCHESTRA_UID is required}:${ORCHESTRA_GID:?ORCHESTRA_GID is required}"
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  environment: &application-environment
    ORCHESTRA_ROOT: /opt/orchestra
    ORCHESTRA_UID: ${ORCHESTRA_UID:?ORCHESTRA_UID is required}
    ORCHESTRA_GID: ${ORCHESTRA_GID:?ORCHESTRA_GID is required}
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONPATH: /opt/orchestra/repo:/opt/orchestra/repo/scripts
  volumes: &application-volumes
    - ../../state:/opt/orchestra/state
    - ../../runtime:/opt/orchestra/runtime
    - ../../workspaces:/opt/orchestra/workspaces
    - ../../project-data:/opt/orchestra/project-data
    - ../../secrets:/opt/orchestra/secrets:ro
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
    - /var/tmp:rw,noexec,nosuid,size=64m
  network_mode: host
  logging: &application-logging
    driver: local
    options:
      max-size: "20m"
      max-file: "5"

services:
  sandbox-engine:
    image: ${HERMES_SANDBOX_ENGINE_IMAGE:?HERMES_SANDBOX_ENGINE_IMAGE is required}
    container_name: orchestra-sandbox-engine
    privileged: true
    restart: unless-stopped
    stop_grace_period: 90s
    environment:
      DOCKER_TLS_CERTDIR: ""
      DOCKER_HOST: unix:///run/orchestra-docker/docker.sock
    command:
      - dockerd
      - "--host=unix:///run/orchestra-docker/docker.sock"
      - "--group=${ORCHESTRA_GID:?ORCHESTRA_GID is required}"
      - "--storage-driver=overlay2"
      - "--log-level=warn"
    volumes:
      - ../../state/sandbox-engine:/var/lib/docker
      - ../../runtime/sandbox-engine-socket:/run/orchestra-docker
      - ../..:/opt/orchestra:ro
      - ../../state/hermes-home:/opt/orchestra/state/hermes-home
      - ../../state/sandboxes:/opt/orchestra/state/sandboxes
      - ../../workspaces:/opt/orchestra/workspaces
      - ../../project-data:/opt/orchestra/project-data
    healthcheck:
      test:
        - CMD-SHELL
        - docker --host unix:///run/orchestra-docker/docker.sock info >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: *application-logging
    networks:
      - orchestra-sandbox-control

  hermes-agent:
    image: ${HERMES_AGENT_IMAGE:?HERMES_AGENT_IMAGE is required}
    container_name: orchestra-hermes-agent
    command: [gateway, run]
    restart: unless-stopped
    stop_grace_period: 90s
    depends_on:
      sandbox-engine:
        condition: service_healthy
    ports:
      - "127.0.0.1:8642:8642"
    env_file:
      - ../../secrets/agent.env
    environment:
      HERMES_HOME: /home/hermes/.hermes
      HERMES_UID: ${ORCHESTRA_UID:?ORCHESTRA_UID is required}
      HERMES_GID: ${ORCHESTRA_GID:?ORCHESTRA_GID is required}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      DOCKER_HOST: unix:///run/orchestra-docker/docker.sock
      DOCKER_TLS_CERTDIR: ""
      HERMES_DOCKER_BINARY: /usr/bin/docker
      TERMINAL_SANDBOX_DIR: /opt/orchestra/state/sandboxes
    volumes:
      - ../../state/hermes-home:/home/hermes/.hermes
      - orchestra-hermes-agent-src:/opt/hermes
      - ../../runtime/sandbox-engine-socket:/run/orchestra-docker
      - ../../state/sandboxes:/opt/orchestra/state/sandboxes
      - ../../workspaces:/opt/orchestra/workspaces
      - ../../project-data:/opt/orchestra/project-data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *application-logging
    networks:
      - orchestra-control

  hermes-webui:
    image: ${HERMES_WEBUI_IMAGE:?HERMES_WEBUI_IMAGE is required}
    container_name: orchestra-hermes-webui
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      hermes-agent:
        condition: service_healthy
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - ../../secrets/webui.env
    environment:
      HERMES_WEBUI_HOST: 0.0.0.0
      HERMES_WEBUI_PORT: "8787"
      HERMES_WEBUI_STATE_DIR: /home/hermeswebui/.hermes/webui
      WANTED_UID: ${ORCHESTRA_UID:?ORCHESTRA_UID is required}
      WANTED_GID: ${ORCHESTRA_GID:?ORCHESTRA_GID is required}
      HERMES_API_URL: http://hermes-agent:8642
      HERMES_WEBUI_CHAT_BACKEND: gateway
      HERMES_WEBUI_GATEWAY_BASE_URL: http://hermes-agent:8642
    volumes:
      - ../../state/hermes-home:/home/hermeswebui/.hermes
      - orchestra-hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent:ro
      - ../../workspaces:/workspace:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    logging: *application-logging
    networks:
      - orchestra-control

  controller:
    <<: *application
    container_name: orchestra-controller
    stop_grace_period: 20s
    command: [python3, /opt/orchestra/repo/scripts/orchestra-controller-api.py, serve, --host, 127.0.0.1, --port, "8765", --log-level, INFO]
    healthcheck:
      test: [CMD, python3, /opt/orchestra/repo/scripts/orchestra-controller-probe.py, --base-url, http://127.0.0.1:8765, --wait-seconds, "2"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  console:
    <<: *application
    container_name: orchestra-console
    stop_grace_period: 20s
    depends_on:
      controller:
        condition: service_healthy
    command: [python3, /opt/orchestra/repo/scripts/orchestra-console.py, serve, --root, /opt/orchestra/repo/console/dist, --host, 127.0.0.1, --port, "8788", --max-connections, "16", --controller-host, 127.0.0.1, --controller-port, "8765", --controller-origin, http://127.0.0.1:8787, --controller-timeout, "5"]
    healthcheck:
      test: [CMD, python3, /opt/orchestra/repo/scripts/orchestra-console-probe.py, --base-url, http://127.0.0.1:8788, --wait-seconds, "2"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  supervisor:
    <<: *application
    container_name: orchestra-supervisor
    stop_grace_period: 30s
    depends_on:
      sandbox-engine:
        condition: service_healthy
      hermes-agent:
        condition: service_healthy
      controller:
        condition: service_healthy
    environment:
      <<: *application-environment
      DOCKER_HOST: unix:///run/orchestra-docker/docker.sock
      DOCKER_CONTEXT: default
      DOCKER_CONFIG: /nonexistent/orchestra-empty-docker-config
    volumes:
      - ../../state:/opt/orchestra/state
      - ../../runtime:/opt/orchestra/runtime
      - ../../workspaces:/opt/orchestra/workspaces
      - ../../project-data:/opt/orchestra/project-data
      - ../../secrets:/opt/orchestra/secrets:ro
      - ../../runtime/sandbox-engine-socket:/run/orchestra-docker
    command: [python3, /opt/orchestra/repo/scripts/orchestra-supervisor.py, run]
    healthcheck:
      test: [CMD, python3, /opt/orchestra/repo/scripts/orchestra-supervisor.py, status]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s

  orchestrator:
    <<: *application
    container_name: orchestra-orchestrator
    stop_grace_period: 120s
    depends_on:
      supervisor:
        condition: service_healthy
    environment:
      <<: *application-environment
      DOCKER_HOST: unix:///run/orchestra-docker/docker.sock
      DOCKER_CONTEXT: default
      DOCKER_CONFIG: /nonexistent/orchestra-empty-docker-config
      HERMES_AGENT_IMAGE: ${HERMES_AGENT_IMAGE:?HERMES_AGENT_IMAGE is required}
    volumes:
      - ../../state:/opt/orchestra/state
      - ../../runtime:/opt/orchestra/runtime
      - ../../workspaces:/opt/orchestra/workspaces
      - ../../project-data:/opt/orchestra/project-data
      - ../../secrets:/opt/orchestra/secrets:ro
      - ../../runtime/sandbox-engine-socket:/run/orchestra-docker
    command: [python3, /opt/orchestra/repo/scripts/orchestra-orchestrator.py, daemon]

  notifier:
    <<: *application
    container_name: orchestra-notifier
    depends_on:
      controller:
        condition: service_healthy
    command: [python3, /opt/orchestra/repo/scripts/orchestra-notifier.py, daemon]

networks:
  orchestra-control:
    name: orchestra-control
    driver: bridge
  orchestra-sandbox-control:
    name: orchestra-sandbox-control
    driver: bridge

volumes:
  orchestra-hermes-agent-src:
    name: orchestra-hermes-agent-src
