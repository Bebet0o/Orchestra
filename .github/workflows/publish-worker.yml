name: Publish Orchestra worker candidate

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Full repository-owned branch ref
        required: true
        type: string
      candidate_sha:
        description: Exact lowercase 40-hex candidate branch head
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'bebet0o/Orchestra' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE_REPOSITORY: ghcr.io/bebet0o/orchestra-worker
      PLATFORM: linux/amd64
    steps:
      - name: Checkout trusted publication foundation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Validate candidate request
        id: request
        env:
          REQUESTED_CANDIDATE_REF: ${{ inputs.candidate_ref }}
          REQUESTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: python3 trusted/.github/scripts/worker_publication.py validate-request

      - name: Fetch and authorize exact candidate branch head
        id: fetched
        env:
          REQUESTED_CANDIDATE_REF: ${{ steps.request.outputs.candidate_ref }}
          REQUESTED_CANDIDATE_SHA: ${{ steps.request.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          git -C trusted fetch --no-tags --no-recurse-submodules --depth=1 --force origin \
            "$REQUESTED_CANDIDATE_REF:refs/remotes/orchestra-publication/candidate"
          FETCHED_CANDIDATE_SHA="$(git -C trusted rev-parse --verify \
            'refs/remotes/orchestra-publication/candidate^{commit}')"
          export FETCHED_CANDIDATE_SHA
          python3 trusted/.github/scripts/worker_publication.py verify-fetched

      - name: Checkout detached candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.fetched.outputs.candidate_sha }}
          path: candidate
          persist-credentials: false

      - name: Verify detached candidate source
        id: source
        env:
          REQUESTED_CANDIDATE_SHA: ${{ steps.request.outputs.candidate_sha }}
          FETCHED_CANDIDATE_SHA: ${{ steps.fetched.outputs.candidate_sha }}
        run: >-
          python3 trusted/.github/scripts/worker_publication.py
          verify-checkout --checkout-path candidate

      - name: Validate candidate Dockerfile base policy
        run: >-
          python3 trusted/scripts/check-worker-oci-image.py
          --dockerfile-policy candidate/images/orchestra-worker.Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build local contract candidate
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: candidate
          file: candidate/images/orchestra-worker.Dockerfile
          platforms: ${{ env.PLATFORM }}
          load: true
          push: false
          provenance: false
          tags: orchestra-worker-contract:${{ steps.source.outputs.candidate_sha }}
          build-args: |
            OCI_REVISION=${{ steps.source.outputs.candidate_sha }}
            OCI_VERSION=candidate-${{ steps.source.outputs.candidate_sha }}

      - name: Resolve exact local image identity
        id: local
        env:
          REQUESTED_CANDIDATE_SHA: ${{ steps.request.outputs.candidate_sha }}
          FETCHED_CANDIDATE_SHA: ${{ steps.fetched.outputs.candidate_sha }}
          CHECKED_OUT_SHA: ${{ steps.source.outputs.candidate_sha }}
          LOCAL_CANDIDATE_TAG: orchestra-worker-contract:${{ steps.source.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          LOCAL_IMAGE_ID="$(docker image inspect --format '{{.Id}}' "$LOCAL_CANDIDATE_TAG")"
          export LOCAL_IMAGE_ID
          python3 trusted/.github/scripts/worker_publication.py validate-local-image

      - name: Validate local contract candidate with trusted checker
        env:
          CANDIDATE_SHA: ${{ steps.source.outputs.candidate_sha }}
          VALIDATED_LOCAL_IMAGE_ID: ${{ steps.local.outputs.validated_local_image_id }}
        run: |
          python3 trusted/scripts/check-worker-oci-image.py \
            --image "$VALIDATED_LOCAL_IMAGE_ID" \
            --expected-revision "$CANDIDATE_SHA"

      - name: Authenticate to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push exact validated local image
        id: pushed
        env:
          REQUESTED_CANDIDATE_SHA: ${{ steps.request.outputs.candidate_sha }}
          FETCHED_CANDIDATE_SHA: ${{ steps.fetched.outputs.candidate_sha }}
          CHECKED_OUT_SHA: ${{ steps.source.outputs.candidate_sha }}
          CANDIDATE_SHA: ${{ steps.source.outputs.candidate_sha }}
          VALIDATED_LOCAL_IMAGE_ID: ${{ steps.local.outputs.validated_local_image_id }}
        run: |
          set -euo pipefail
          REGISTRY_TAG="${IMAGE_REPOSITORY}:candidate-${CANDIDATE_SHA}"
          docker image tag "$VALIDATED_LOCAL_IMAGE_ID" "$REGISTRY_TAG"
          TAGGED_LOCAL_IMAGE_ID="$(docker image inspect --format '{{.Id}}' "$REGISTRY_TAG")"
          if [[ "$TAGGED_LOCAL_IMAGE_ID" != "$VALIDATED_LOCAL_IMAGE_ID" ]]; then
            echo "Registry tag does not identify validated local image" >&2
            exit 1
          fi
          PUSH_OUTPUT_PATH="$(mktemp "${RUNNER_TEMP}/orchestra-worker-push.XXXXXX")"
          if ! docker image push "$REGISTRY_TAG" >"$PUSH_OUTPUT_PATH" 2>&1; then
            echo "Worker image push failed" >&2
            exit 1
          fi
          REGISTRY_TAG_IMAGE_ID="$(docker image inspect --format '{{.Id}}' "$REGISTRY_TAG")"
          REGISTRY_REPO_DIGESTS="$(docker image inspect --format '{{json .RepoDigests}}' "$REGISTRY_TAG")"
          export REGISTRY_TAG PUSH_OUTPUT_PATH REGISTRY_TAG_IMAGE_ID REGISTRY_REPO_DIGESTS
          python3 trusted/.github/scripts/worker_publication.py verify-pushed

      - name: Create trusted provisional publication record
        env:
          REQUESTED_CANDIDATE_REF: ${{ steps.request.outputs.candidate_ref }}
          REQUESTED_CANDIDATE_SHA: ${{ steps.request.outputs.candidate_sha }}
          FETCHED_CANDIDATE_SHA: ${{ steps.fetched.outputs.candidate_sha }}
          CHECKED_OUT_SHA: ${{ steps.source.outputs.candidate_sha }}
          REVISION_LABEL: ${{ steps.source.outputs.candidate_sha }}
          OCI_DIGEST: ${{ steps.pushed.outputs.registry_digest }}
          WORKFLOW_RUN: ${{ github.run_id }}
        run: >-
          python3 trusted/.github/scripts/worker_publication.py
          record-provisional

      - name: Upload provisional publication record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orchestra-worker-publication-provisional-${{ steps.source.outputs.candidate_sha }}
          path: trusted/worker-publication-provisional.json
          if-no-files-found: error
          retention-days: 14
