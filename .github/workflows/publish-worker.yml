name: Publish Orchestra worker candidate

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Full repository-owned branch ref
        required: true
        type: string
      candidate_sha:
        description: Exact lowercase 40-hex candidate branch head
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'bebet0o/Orchestra' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE_REPOSITORY: ghcr.io/bebet0o/orchestra-worker
      PLATFORM: linux/amd64
    steps:
      - name: Checkout trusted publication foundation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Validate candidate request
        id: request
        env:
          REQUESTED_CANDIDATE_REF: ${{ inputs.candidate_ref }}
          REQUESTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: python3 trusted/.github/scripts/worker_publication.py validate-request

      - name: Fetch and authorize exact candidate branch head
        id: fetched
        env:
          REQUESTED_CANDIDATE_REF: ${{ steps.request.outputs.candidate_ref }}
          REQUESTED_CANDIDATE_SHA: ${{ steps.request.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          git -C trusted fetch --no-tags --no-recurse-submodules --depth=1 --force origin \
            "$REQUESTED_CANDIDATE_REF:refs/remotes/orchestra-publication/candidate"
          FETCHED_CANDIDATE_SHA="$(git -C trusted rev-parse --verify \
            'refs/remotes/orchestra-publication/candidate^{commit}')"
          export FETCHED_CANDIDATE_SHA
          python3 trusted/.github/scripts/worker_publication.py verify-fetched

      - name: Checkout detached candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.fetched.outputs.candidate_sha }}
          path: candidate
          persist-credentials: false

      - name: Verify detached candidate source
        id: source
        env:
          REQUESTED_CANDIDATE_SHA: ${{ steps.request.outputs.candidate_sha }}
          FETCHED_CANDIDATE_SHA: ${{ steps.fetched.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          if git -C candidate symbolic-ref -q HEAD >/dev/null; then
            echo "Candidate checkout is not detached" >&2
            exit 1
          fi
          CHECKED_OUT_SHA="$(git -C candidate rev-parse --verify HEAD)"
          export CHECKED_OUT_SHA
          python3 trusted/.github/scripts/worker_publication.py verify-checkout

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build local contract candidate
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: candidate
          file: candidate/images/orchestra-worker.Dockerfile
          platforms: ${{ env.PLATFORM }}
          load: true
          push: false
          provenance: false
          tags: orchestra-worker-contract:${{ steps.source.outputs.candidate_sha }}
          build-args: |
            OCI_REVISION=${{ steps.source.outputs.candidate_sha }}
            OCI_VERSION=candidate-${{ steps.source.outputs.candidate_sha }}

      - name: Validate local contract candidate with trusted checker
        env:
          CANDIDATE_SHA: ${{ steps.source.outputs.candidate_sha }}
        run: |
          python3 trusted/scripts/check-worker-oci-image.py \
            --image "orchestra-worker-contract:$CANDIDATE_SHA" \
            --expected-revision "$CANDIDATE_SHA"

      - name: Authenticate to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push candidate
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: candidate
          file: candidate/images/orchestra-worker.Dockerfile
          platforms: ${{ env.PLATFORM }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE_REPOSITORY }}:candidate-${{ steps.source.outputs.candidate_sha }}
          build-args: |
            OCI_REVISION=${{ steps.source.outputs.candidate_sha }}
            OCI_VERSION=candidate-${{ steps.source.outputs.candidate_sha }}

      - name: Create trusted machine-readable publication record
        env:
          REQUESTED_CANDIDATE_SHA: ${{ steps.request.outputs.candidate_sha }}
          FETCHED_CANDIDATE_SHA: ${{ steps.fetched.outputs.candidate_sha }}
          CHECKED_OUT_SHA: ${{ steps.source.outputs.candidate_sha }}
          REVISION_LABEL: ${{ steps.source.outputs.candidate_sha }}
          OCI_DIGEST: ${{ steps.push.outputs.digest }}
          WORKFLOW_RUN: ${{ github.run_id }}
        run: python3 trusted/.github/scripts/worker_publication.py record

      - name: Upload publication record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orchestra-worker-publication-${{ steps.source.outputs.candidate_sha }}
          path: trusted/worker-publication.json
          if-no-files-found: error
          retention-days: 14
