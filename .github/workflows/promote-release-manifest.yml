name: Promote accepted Orchestra release manifest

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Exact release version
        required: true
        type: string
      candidate_ref:
        description: Exact accepted candidate branch ref
        required: true
        type: string
      candidate_sha:
        description: Exact certified product source revision
        required: true
        type: string
      acceptance_run_id:
        description: Exact successful accept-official-images workflow run
        required: true
        type: string
      accepted_artifact_id:
        description: Exact accepted artifact ID from that run
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: orchestra-release-manifest-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'bebet0o/Orchestra' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Validate promotion request
        id: request
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          REQUESTED_CANDIDATE_REF: ${{ inputs.candidate_ref }}
          REQUESTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          ACCEPTED_ARTIFACT_ID: ${{ inputs.accepted_artifact_id }}
        run: |
          set -euo pipefail
          test "$RELEASE_VERSION" = 'v0.2.0'
          python3 trusted/.github/scripts/official_image_publication.py validate-request
          python3 - "$ACCEPTANCE_RUN_ID" "$ACCEPTED_ARTIFACT_ID" <<'PY'
          import sys
          for name, value in zip(("acceptance_run_id", "accepted_artifact_id"), sys.argv[1:]):
              if not value.isascii() or not value.isdecimal() or int(value) < 1:
                  raise SystemExit(f"invalid {name}")
          PY

      - name: Checkout exact certified product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.request.outputs.candidate_sha }}
          path: certified
          persist-credentials: false

      - name: Reauthorize candidate branch binding
        env:
          CANDIDATE_REF: ${{ steps.request.outputs.candidate_ref }}
          CANDIDATE_SHA: ${{ steps.request.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          remote_sha="$(git -C trusted ls-remote --exit-code origin "$CANDIDATE_REF" | awk 'NR == 1 { print $1 }')"
          test "$remote_sha" = "$CANDIDATE_SHA"
          test "$(git -C certified rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Retrieve trusted acceptance evidence
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          ARTIFACT_ID: ${{ inputs.accepted_artifact_id }}
        run: |
          set -euo pipefail
          mkdir evidence-input
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ACCEPTANCE_RUN_ID}" \
            >evidence-input/workflow-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" \
            >evidence-input/artifact-metadata.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            >evidence-input/artifact.zip

      - name: Promote and prove exact release manifest
        run: |
          set -euo pipefail
          python3 trusted/.github/scripts/release_manifest_promotion.py \
            --workflow-run-metadata evidence-input/workflow-run.json \
            --artifact-metadata evidence-input/artifact-metadata.json \
            --artifact-archive evidence-input/artifact.zip \
            --certified-installer certified/install.sh \
            --candidate-ref '${{ steps.request.outputs.candidate_ref }}' \
            --candidate-sha '${{ steps.request.outputs.candidate_sha }}' \
            --acceptance-run-id '${{ inputs.acceptance_run_id }}' \
            --accepted-artifact-id '${{ inputs.accepted_artifact_id }}' \
            --output-directory promotion

      - name: Upload trusted promotion result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orchestra-release-manifest-${{ inputs.release_version }}-${{ steps.request.outputs.candidate_sha }}
          path: promotion
          if-no-files-found: error
          retention-days: 14
